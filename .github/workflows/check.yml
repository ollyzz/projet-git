name: Ma premiere action

on: [push, pull_request]

jobs:
  job_un:
    runs-on: ubuntu-latest
    steps:
      - name: Recupere le code
        uses: actions/checkout@v4

      - name: Afficher les fichiers
        run: ls -R
      - name: Lancer le lint (phpcs)
        run: phpcs --standard=PSR12 TP5/src/