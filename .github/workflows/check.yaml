name: Qualite PHP (Lint, Arbo, Unit)

on: [push, pull_request]

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpcs, phpunit
          coverage: pcov

      - name: Lancer le lint (PSR12)
        run: phpcs --standard=PSR12 TP5/src/

      - name: Verifier l'arborescence
        run: php .github/scripts/verif_arbo.php

      - name: Lancer les tests unitaires (100%)
        run: ./vendor/bin/phpunit --coverage-text