name: Tests E2E TestCafe

on: [push, pull_request]

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Recupere le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lancer le serveur PHP local
        # On part de la racine du dépôt, donc juste le nom du dossier
        run: |
          php -S localhost:8000 -t qualitecode/app &
          sleep 5 # <--- TRÈS IMPORTANT : Laisse 5 secondes au serveur pour s'allumer

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer TestCafe
        run: npm install testcafe

      - name: Executer le test E2E (Headless)
        # On utilise le chemin relatif direct depuis la racine
        run: npx testcafe chrome:headless qualitecode/tests/test_majuscules.js